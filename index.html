<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .login-box {
    background:#fff;
    padding:40px 30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    width:100%;
    max-width:360px;
  }
  .login-box h2 {
    text-align:center;
    margin-bottom:24px;
    color:#333;
  }
  .input-group { margin-bottom:18px; }
  .input-group label {
    display:block;
    margin-bottom:6px;
    font-size:14px;
    color:#555;
  }
  .input-group input {
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:border 0.2s;
  }
  .input-group input:focus { border-color:#764ba2; }
  .login-btn {
    width:100%;
    padding:12px;
    background:#764ba2;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .login-btn:hover { background:#5e3a85; }
  .error-msg {
    color:#e74c3c;
    font-size:13px;
    text-align:center;
    margin-top:10px;
    min-height:16px;
  }
  .extra-links {
    text-align:center;
    margin-top:16px;
    font-size:13px;
  }
  .extra-links a {
    color:#764ba2;
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="login-box">
  <h2>เข้าสู่ระบบ</h2>
  <form id="loginForm">
    <div class="input-group">
      <label for="username">ชื่อผู้ใช้</label>
      <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
    </div>
    <div class="input-group">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
    </div>
    <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <div class="extra-links">
    <a href="#">ลืมรหัสผ่าน?</a>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (username === '' || password === '') {
      errorMsg.textContent = 'กรุณากรอกข้อมูลให้ครบ';
      return;
    }

    // ตรงนี้ใส่ logic เช็ค login จริง เช่น fetch ไป API
    errorMsg.style.color = '#27ae60';
    errorMsg.textContent = 'เข้าสู่ระบบสำเร็จ (ตวอย่าง)';
  });
</script>

</body>
</html>
